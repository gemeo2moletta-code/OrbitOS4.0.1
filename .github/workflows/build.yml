
name: Compilar OrbitOS 4.0

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar PlatformIO
        run: pip install platformio

      - name: Localizar projeto e compilar
        shell: bash
        run: |
          PROJECT_FILE=$(find . -name platformio.ini -not -path '*/.pio/*' -print -quit)

          if [ -z "$PROJECT_FILE" ]; then
            echo "::error::Arquivo platformio.ini nao encontrado no repositorio!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          echo "Projeto encontrado em: $PROJECT_DIR"

          pio run -d "$PROJECT_DIR" -e esp32dev

          mkdir -p firmware-output
          cp "$PROJECT_DIR/.pio/build/esp32dev/"*.bin firmware-output/

      - name: Disponibilizar firmware
        uses: actions/upload-artifact@v4
        with:
          name: OrbitOS-4.0-Firmware
          path: firmware-output/*.bin
          if-no-files-found: error
